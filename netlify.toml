[build]
  publish = "."
  # No publicar (ni gastar créditos) si el cambio solo toca la carpeta supabase/.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)supabase'"

[[redirects]]
  from = "/cuenta"
  to = "/cuenta.html"
  status = 200

[[redirects]]
  from = "/mi-perfil"
  to = "/mi-perfil.html"
  status = 200

[[redirects]]
  from = "/admin/simulador"
  to = "/simulador.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/nueva-contrasena"
  to = "/nueva-contrasena.html"
  status = 200

[[redirects]]
  from = "/registro"
  to = "/registro.html"
  status = 200

[[redirects]]
  from = "/privacidad"
  to = "/privacidad.html"
  status = 200

[[redirects]]
  from = "/terminos"
  to = "/terminos.html"
  status = 200

[[redirects]]
  from = "/gracias"
  to = "/gracias.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
